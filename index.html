<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agravitine — Issue Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --sky:#1B2735;
    --void:#12181F;
    --panel:#1D2A26;
    --panel-hi:#26362F;
    --line:#3A4A42;
    --grass:#6FBF3E;
    --grass-dim:#4C8E29;
    --dirt:#9C6A33;
    --dirt-dim:#7A5227;
    --water:#3E8FC4;
    --water-dim:#2C6D9C;
    --redstone:#D9432E;
    --bone:#EDEFE4;
    --mist:#8A9A8E;
  }

  *{ box-sizing:border-box; image-rendering:pixelated; }
  body{ image-rendering:auto; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      linear-gradient(180deg, var(--sky) 0%, var(--void) 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 4px);
    color: var(--bone);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding: 40px 20px 80px;
  }

  .wrap{ max-width: 920px; margin:0 auto; }

  /* Minecraft-style beveled panel: light top/left edge, dark bottom/right edge */
  .bevel{
    border-radius:0;
    box-shadow:
      inset 2px 2px 0 rgba(255,255,255,0.10),
      inset -2px -2px 0 rgba(0,0,0,0.35);
  }

  /* ---------- Header ---------- */
  header{ margin-bottom:6px; text-align:center; }
  .logo{ width:100%; max-width:560px; height:auto; display:block; margin:0 auto 10px; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.4)); }
  .subtitle{
    color:var(--mist); font-size:13px; margin-top:2px; font-family:'JetBrains Mono', monospace;
    text-align:center; letter-spacing:0.03em;
  }

  .stats-bar{
    display:flex; gap:0; margin: 26px 0 30px;
    background: var(--panel);
    border: 3px solid var(--void);
  }
  .stat{ flex:1; display:flex; flex-direction:column; gap:2px; padding:14px 16px; border-right:2px solid var(--line); }
  .stat:last-child{ border-right:none; }
  .stat .n{ font-family:'Silkscreen',monospace; font-size:20px; font-weight:700; }
  .stat .l{ font-size:10.5px; color:var(--mist); text-transform:uppercase; letter-spacing:0.08em; }

  /* ---------- Card shell ---------- */
  .card{
    background: var(--panel);
    border: 3px solid var(--void);
    padding: 22px;
  }

  /* ---------- Submit form ---------- */
  .submit-card{ margin-bottom: 34px; }
  .submit-card h2{
    font-family:'Silkscreen',monospace; font-size:15px; margin:0 0 18px; font-weight:700;
    color: var(--grass);
    display:flex; align-items:center; gap:8px;
  }
  label{ display:block; font-size:11.5px; color:var(--mist); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.06em; font-family:'JetBrains Mono',monospace; }
  .field{ margin-bottom:16px; }
  input[type=text], textarea, select{
    width:100%;
    background: var(--void);
    border:2px solid var(--line);
    border-radius:0;
    color:var(--bone);
    padding:11px 13px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    resize:vertical;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    outline:none; border-color:var(--water);
    box-shadow: 0 0 0 3px rgba(62,143,196,0.25);
  }
  textarea{ min-height:90px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .severity-picker{ display:flex; gap:6px; }
  .sev-btn{
    flex:1; padding:10px 0; border:2px solid var(--line);
    background:var(--void); color:var(--mist); font-family:'Silkscreen',monospace; font-size:13px;
    cursor:pointer; transition: all .1s;
  }
  .sev-btn:hover{ border-color: var(--water-dim); }
  .sev-btn.active{ border-color:var(--water); color:var(--water); background:rgba(62,143,196,0.15); }
  .sev-btn.active.hi{ border-color:var(--redstone); color:var(--redstone); background:rgba(217,67,46,0.15); }

  button.primary{
    background: var(--grass-dim);
    border:2px solid var(--void);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,0.18), inset -2px -2px 0 rgba(0,0,0,0.3);
    color:#F3FFEA; font-weight:700; font-family:'Silkscreen',monospace;
    padding:13px 22px; cursor:pointer; font-size:13px; letter-spacing:0.02em;
  }
  button.primary:hover{ background: var(--grass); }
  button.primary:active{ box-shadow: inset -2px -2px 0 rgba(255,255,255,0.18), inset 2px 2px 0 rgba(0,0,0,0.3); }
  button.primary:disabled{ opacity:0.5; cursor:wait; }

  .mod-note{
    font-size:12px; color:var(--mist); margin-top:14px; display:flex; gap:8px; align-items:flex-start;
    line-height:1.5;
  }
  .mod-note svg{ flex-shrink:0; margin-top:2px; }

  .flash{ margin-top:14px; padding:11px 14px; border:2px solid; font-size:13px; display:none; font-family:'JetBrains Mono',monospace; }
  .flash.show{ display:block; }
  .flash.err{ background: rgba(217,67,46,0.12); border-color: rgba(217,67,46,0.5); color:#FFB3A6; }
  .flash.ok{ background: rgba(111,191,62,0.12); border-color: rgba(111,191,62,0.5); color:#C7F0A3; }

  /* ---------- Filters ---------- */
  .filters{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .filters input[type=text]{ flex:1; min-width:160px; }
  .filters select{ width:auto; }
  .filter-count{ font-size:12px; color:var(--mist); font-family:'JetBrains Mono',monospace; margin-left:auto; }

  /* ---------- Issue list ---------- */
  .issue{
    background: var(--panel);
    border: 3px solid var(--void);
    padding:18px 20px;
    margin-bottom:14px;
    display:flex; gap:16px;
  }

  .gravity-meter{
    flex-shrink:0; width:24px; display:flex; flex-direction:column-reverse; align-items:center; gap:3px;
    padding-top:2px;
  }
  .gravity-meter .pip{ width:14px; height:8px; background:var(--line); }
  .gravity-meter .pip.on{ background: var(--grass); }
  .gravity-meter .pip.on.mid{ background: var(--dirt); }
  .gravity-meter .pip.on.high{ background: var(--redstone); }

  .issue-body{ flex:1; min-width:0; }
  .issue-top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .badge{
    font-size:10px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.05em;
    padding:3px 8px; border:1px solid var(--line);
  }
  .badge.bug{ color:#D9A15A; border-color:rgba(156,106,51,0.5); }
  .badge.crash{ color:#FF8A7A; border-color:rgba(217,67,46,0.5); }
  .badge.feature{ color:#7FC7F7; border-color:rgba(62,143,196,0.5); }
  .badge.other{ color:var(--mist); }

  .status-pill{
    font-size:11px; padding:4px 10px; font-family:'JetBrains Mono',monospace;
    margin-left:auto; cursor:pointer; border:1px solid transparent;
  }
  .status-pill.open{ background:rgba(217,67,46,0.12); color:#FF8A7A; }
  .status-pill.in-progress{ background:rgba(62,143,196,0.14); color:#7FC7F7; }
  .status-pill.resolved{ background:rgba(111,191,62,0.14); color:#A6E37D; }

  .issue h3{ font-family:'Silkscreen',monospace; font-size:15px; margin:0 0 8px; font-weight:700; color:var(--bone); }
  .issue p{ font-size:13.5px; color:#C4CDBE; line-height:1.55; margin:0 0 10px; white-space:pre-wrap; }

  .issue-foot{ display:flex; align-items:center; gap:14px; font-size:11.5px; color:var(--mist); font-family:'JetBrains Mono',monospace; }
  .vote-btn{
    background:var(--void); border:1px solid var(--line); color:var(--mist);
    padding:4px 10px; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace;
  }
  .vote-btn.voted{ color:var(--grass); border-color:var(--grass); }
  .del-btn{ background:none; border:none; color:var(--mist); cursor:pointer; margin-left:auto; font-size:11.5px; }
  .del-btn:hover{ color:var(--redstone); }

  .empty{ text-align:center; padding:50px 20px; color:var(--mist); font-family:'JetBrains Mono',monospace; font-size:13px; }
  .empty .block{ width:32px; height:32px; margin:0 auto 16px; background: linear-gradient(180deg, var(--grass) 0 40%, var(--dirt) 40% 100%); border:2px solid var(--void); opacity:0.7; }

  ::placeholder{ color:#59685E; }

  .owner-bar{ display:flex; justify-content:flex-end; margin: -14px 0 20px; }
  .owner-toggle{
    background:none; border:1px solid var(--line); color:var(--mist);
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 10px; cursor:pointer;
  }
  .owner-toggle.on{ color:var(--grass); border-color:var(--grass); }
  .status-badge{
    font-size:11px; padding:4px 10px; font-family:'JetBrains Mono',monospace; margin-left:auto;
  }
  .status-badge.open{ background:rgba(217,67,46,0.12); color:#FF8A7A; }
  .status-badge.in-progress{ background:rgba(62,143,196,0.14); color:#7FC7F7; }
  .status-badge.resolved{ background:rgba(111,191,62,0.14); color:#A6E37D; }

  .badge.modtag{ color:#7FC7F7; border-color:rgba(62,143,196,0.5); font-weight:700; }

  .owner-panel-title{ color:var(--water); }
  .mod-chip{
    display:inline-flex; align-items:center; gap:7px;
    font-size:11px; font-family:'JetBrains Mono',monospace;
    padding:5px 8px; border:1px solid var(--line); background:var(--void);
  }
  .mod-chip button{
    background:none; border:none; color:var(--redstone); cursor:pointer; font-size:13px; line-height:1; padding:0;
  }
  .add-mod-row{ display:flex; gap:8px; align-items:flex-end; }
  .add-mod-row .field{ flex:1; margin-bottom:0; }
</style>
</head>

  <div class="stats-bar bevel" id="statsBar"></div>

  <div class="card submit-card bevel">
    <h2>Report an issue</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Agravitine block crashes game on right-click" maxlength="120">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="fDesc" placeholder="What happened, what you expected, mod loader + version, steps to reproduce..." maxlength="2000"></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label>Mod</label>
        <select id="rMod"><option value="">Loading mods…</option></select>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="fCategory">
          <option value="bug">Bug</option>
          <option value="crash">Crash</option>
          <option value="feature">Feature request</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Severity</label>
      <div class="severity-picker" id="sevPicker">
        <button type="button" class="sev-btn" data-v="1" onclick="selectSeverity(1)">1</button>
        <button type="button" class="sev-btn" data-v="2" onclick="selectSeverity(2)">2</button>
        <button type="button" class="sev-btn active" data-v="3" onclick="selectSeverity(3)">3</button>
        <button type="button" class="sev-btn" data-v="4" onclick="selectSeverity(4)">4</button>
        <button type="button" class="sev-btn" data-v="5" onclick="selectSeverity(5)">5</button>
      </div>
    </div>
    <button class="primary" id="submitBtn">Submit report</button>
    <div class="flash" id="flash"></div>
    <div class="mod-note">

      <span>Reports are screened automatically before they're posted, to keep this space useful for actual bug reports. Everything here is visible to anyone with this tracker — don't include personal info.</span>
    </div>
  </div>

    <input type="text" id="fSearch" placeholder="Search issues...">

      <option value="other">Other</option>
    </select>
    <select id="fStatus">
      <option value="all">All statuses</option>
      <option value="open">Open</option>
      <option value="in-progress">In progress</option>
      <option value="resolved">Resolved</option>
    </select>
    <select id="fSort">
      <option value="new">Newest</option>
      <option value="votes">Most voted</option>
      <option value="severity">Highest severity</option>
    </select>
    <span class="filter-count" id="filterCount"></span>
  </div>

  <div id="issueList"></div>
</div>

<script>
const STORAGE_KEY = 'agravitine-issues';
const VOTED_KEY = 'agravitine-voted-ids';
let issues = [];
let votedIds = [];
let selectedSeverity = 3;

// OWNER_PIN is never stored here anymore. Checking it happens on a tiny
// Cloudflare Worker (see worker.js) so the real PIN never reaches the
// browser at all — only a signed session token does.
// Set this to your deployed Worker's URL after running `wrangler deploy`.
const PIN_CHECK_URL = 'https://agravitine-pin-check.YOUR-SUBDOMAIN.workers.dev';
const TOKEN_KEY = 'agravitine-owner-token';
let isOwner = false;
let ownerToken = null;

async function loadOwnerState(){
  try{
    const res = await window.storage.get(TOKEN_KEY, false);
    ownerToken = res && res.value ? res.value : null;
  }catch(e){ ownerToken = null; }
  isOwner = ownerToken ? await verifyOwnerToken() : false;
  if(!isOwner) ownerToken = null;
  updateOwnerToggle();
}

// Asks the Worker whether the token we're holding is still valid. This is
// the check that actually stops someone from just setting `isOwner = true`
// in the console — without a real token (which only the Worker can issue
// and verify), this always comes back false.
async function verifyOwnerToken(){
  if(!ownerToken) return false;
  try{
    const res = await fetch(PIN_CHECK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'verify', token: ownerToken })
    });
    const data = await res.json();
    return !!data.ok;
  }catch(e){
    return false;
  }
}

function updateOwnerToggle(){
  const btn = document.getElementById('ownerToggle');
  if(btn){
    btn.textContent = isOwner ? '🔓 Owner mode on' : '🔒 Unlock owner tools';
    btn.classList.toggle('on', isOwner);
  }
  renderOwnerModPanel();
}

async function toggleOwnerMode(){
  if(isOwner){
    isOwner = false;
    ownerToken = null;
    try{ await window.storage.delete(TOKEN_KEY, false); }catch(e){}
    updateOwnerToggle();
    render();
    return;
  }
  const entered = prompt('Enter owner PIN to unlock status editing and delete:');
  if(entered === null) return;

  let data;
  try{
    const res = await fetch(PIN_CHECK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', pin: entered })
    });
    data = await res.json();
  }catch(e){
    showFlash('err', 'Could not reach the PIN check right now — try again in a moment.');
    return;
  }

  if(data.ok && data.token){
    isOwner = true;
    ownerToken = data.token;
    try{ await window.storage.set(TOKEN_KEY, ownerToken, false); }catch(e){}
    showFlash('ok', 'Owner tools unlocked on this device (valid 24 hours).');
  }else{
    showFlash('err', 'Wrong PIN.');
  }
  updateOwnerToggle();
  render();
}

function esc(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function uid(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }

async function loadIssues(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    issues = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ issues = []; }
  try{
    const v = await window.storage.get(VOTED_KEY, false);
    votedIds = v && v.value ? JSON.parse(v.value) : [];
  }catch(e){ votedIds = []; }
  render();
}

async function saveIssues(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(issues), true);
  }catch(e){
    showFlash('err', 'Could not save your report right now — please try again.');
  }
}

async function saveVoted(){
  try{ await window.storage.set(VOTED_KEY, JSON.stringify(votedIds), false); }catch(e){}
}

function showFlash(type, msg){
  const f = document.getElementById('flash');
  f.className = 'flash show ' + type;
  f.textContent = msg;
  setTimeout(()=>{ f.className = 'flash'; }, 6000);
}

// --- Severity picker ---
function selectSeverity(v){
  selectedSeverity = v;
  document.querySelectorAll('.sev-btn').forEach(b=>{
    b.classList.remove('active','hi');
    if(parseInt(b.dataset.v,10) === v){
      b.classList.add('active');
      if(v >= 4) b.classList.add('hi');
    }
  });
}

// --- Mods ---
const MODS_KEY = 'agravitine-mods';
let mods = [];

async function loadMods(){
  try{
    const res = await window.storage.get(MODS_KEY, true);
    mods = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ mods = []; }
  if(mods.length === 0){
    mods = ['Agravitine'];
    await saveMods();
  }
  renderModSelects();
}

async function saveMods(){
  try{
    await window.storage.set(MODS_KEY, JSON.stringify(mods), true);
  }catch(e){
    showFlash('err', 'Could not save the mod list right now.');
  }
}

function renderModSelects(){
  const optsHtml = mods.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');

  const rMod = document.getElementById('rMod');
  if(rMod){
    const current = rMod.value;
    rMod.innerHTML = optsHtml;
    rMod.value = mods.includes(current) ? current : mods[0];
  }

  const fMod = document.getElementById('fMod');
  if(fMod){
    const current = fMod.value;
    fMod.innerHTML = `<option value="all">All mods</option>` + optsHtml;
    fMod.value = (current === 'all' || mods.includes(current)) ? current : 'all';
  }

  renderOwnerModPanel();
  render();
}

function renderOwnerModPanel(){
  const panel = document.getElementById('ownerPanel');
  if(!panel) return;
  if(!isOwner){ panel.innerHTML = ''; return; }

  panel.innerHTML = `
    <div class="card bevel" style="margin-bottom:24px;">
      <h2 class="owner-panel-title" style="font-family:'Silkscreen',monospace; font-size:15px; margin:0 0 16px; font-weight:700;">Manage mods</h2>
      <div class="add-mod-row">
        <div class="field">
          <label>New mod name</label>
          <input type="text" id="newModName" placeholder="e.g. RealTerra" maxlength="60">
        </div>
        <button class="primary" style="background:var(--water-dim)" onclick="addMod()">Add mod</button>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;">
        ${mods.map(m=>`<span class="mod-chip" data-mod="${esc(m)}">${esc(m)}<button class="remove-mod-btn" data-mod="${esc(m)}">×</button></span>`).join('')}
      </div>
    </div>
  `;

  panel.querySelectorAll('.remove-mod-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> removeMod(btn.dataset.mod));
  });
}

async function addMod(){
  if(!(await verifyOwnerToken())){
    isOwner = false; ownerToken = null; updateOwnerToggle();
    showFlash('err', 'Owner session not valid — unlock owner tools again.');
    return;
  }
  const input = document.getElementById('newModName');
  const name = input.value.trim();
  if(!name){ showFlash('err', 'Enter a mod name first.'); return; }
  if(mods.some(m => m.toLowerCase() === name.toLowerCase())){
    showFlash('err', 'That mod is already in the list.');
    return;
  }
  mods.push(name);
  await saveMods();
  renderModSelects();
  showFlash('ok', `Added "${name}" to the mod list.`);
}

async function removeMod(name){
  if(!(await verifyOwnerToken())){
    isOwner = false; ownerToken = null; updateOwnerToggle();
    showFlash('err', 'Owner session not valid — unlock owner tools again.');
    return;
  }
  if(mods.length <= 1){
    showFlash('err', 'Keep at least one mod in the list.');
    return;
  }
  mods = mods.filter(m => m !== name);
  await saveMods();
  renderModSelects();
}

// --- Moderation ---
// Screens submitted text with the Anthropic API before anything is posted,
// so reports stay on-topic without anyone having to manually police it.
async function moderate(title, description){
  const prompt = `You are a content moderator for a public bug/issue tracker for a hobby Minecraft mod called "Agravitine" (Agravitine is a block/item in the mod). Classify the following user-submitted report.

Reject ONLY if it is: spam/advertising, hate speech or harassment, sexual content, or completely unrelated gibberish with no genuine report in it.
ALLOW genuine bug reports, crash reports, or feature requests -- even if short, badly written, casual, or frustrated in tone. Mild swearing directed at the software (not at people) is fine.

Title: ${title}
Description: ${description}

Respond with ONLY a JSON object, no other text, no markdown fences:
{"allowed": true or false, "reason": "short reason, empty string if allowed"}`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    const raw = textBlock ? textBlock.text : '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    return { allowed: !!parsed.allowed, reason: parsed.reason || '' };
  }catch(e){
    const looksLikeLink = /https?:\/\//.test(title + description) && description.trim().length < 15;
    const tooShort = title.trim().length < 3;
    if (looksLikeLink || tooShort){
      return { allowed:false, reason:'Report looks incomplete or link-only.' };
    }
    return { allowed:true, reason:'' };
  }
}

// --- Rendering ---
function updateStats(){
  const open = issues.filter(i=>i.status==='open').length;
  const inProg = issues.filter(i=>i.status==='in-progress').length;
  const resolved = issues.filter(i=>i.status==='resolved').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="n">${issues.length}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n" style="color:#FF8A7A">${open}</div><div class="l">Open</div></div>
    <div class="stat"><div class="n" style="color:#7FC7F7">${inProg}</div><div class="l">In progress</div></div>
    <div class="stat"><div class="n" style="color:#A6E37D">${resolved}</div><div class="l">Resolved</div></div>
  `;
}

function gravityMeter(sev){
  let pips = '';
  for(let i=1;i<=5;i++){
    const on = i<=sev;
    let cls = '';
    if(on){
      if(sev>=4) cls = 'high';
      else if(sev===3) cls = 'mid';
    }
    pips += `<div class="pip ${on?'on':''} ${cls}"></div>`;
  }
  return `<div class="gravity-meter" title="Severity ${sev}/5">${pips}</div>`;
}

function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60)+'m ago';
  if(diff < 86400) return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}

function render(){
  updateStats();
  const search = document.getElementById('fSearch').value.toLowerCase();
  const modFilter = document.getElementById('fMod') ? document.getElementById('fMod').value : 'all';
  const cat = document.getElementById('fCat').value;
  const status = document.getElementById('fStatus').value;
  const sort = document.getElementById('fSort').value;

  let list = issues.filter(i=>{
    const iMod = i.mod || 'Agravitine';
    if(modFilter !== 'all' && iMod !== modFilter) return false;
    if(cat !== 'all' && i.category !== cat) return false;
    if(status !== 'all' && i.status !== status) return false;
    if(search && !(i.title.toLowerCase().includes(search) || i.description.toLowerCase().includes(search) || iMod.toLowerCase().includes(search))) return false;
    return true;
  });

  if(sort === 'new') list.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(sort === 'votes') list.sort((a,b)=> b.votes - a.votes);
  if(sort === 'severity') list.sort((a,b)=> b.severity - a.severity);

  document.getElementById('filterCount').textContent = `${list.length} shown`;

  const container = document.getElementById('issueList');
  if(list.length === 0){
    container.innerHTML = `<div class="empty">
      <div class="block"></div>
      ${issues.length===0 ? 'No reports yet. Be the first to report something.' : 'Nothing matches these filters.'}
    </div>`;
    return;
  }

  container.innerHTML = list.map((idata) => {
    const i = idata;
    const voted = votedIds.includes(i.id);
    return `
    <div class="issue bevel">
      ${gravityMeter(i.severity)}
      <div class="issue-body">
        <div class="issue-top">
          <span class="badge modtag">${esc(i.mod || 'Agravitine')}</span>
          <span class="badge ${i.category}">${i.category}</span>
          ${isOwner ? `
          <select class="status-pill ${i.status}" onchange="setStatus('${i.id}', this.value)" style="border:none;">
            <option value="open" ${i.status==='open'?'selected':''}>open</option>
            <option value="in-progress" ${i.status==='in-progress'?'selected':''}>in progress</option>
            <option value="resolved" ${i.status==='resolved'?'selected':''}>resolved</option>
          </select>` : `
          <span class="status-badge ${i.status}">${i.status}</span>`}
        </div>
        <h3>${esc(i.title)}</h3>
        <p>${esc(i.description)}</p>
        <div class="issue-foot">
          <button class="vote-btn ${voted?'voted':''}" onclick="toggleVote('${i.id}')">▲ ${i.votes}</button>
          <span>${timeAgo(i.createdAt)}</span>
          ${isOwner ? `<button class="del-btn" onclick="deleteIssue('${i.id}')">Remove</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function setStatus(id, status){
  if(!(await verifyOwnerToken())){
    isOwner = false; ownerToken = null; updateOwnerToggle(); render();
    showFlash('err', 'Owner session not valid — unlock owner tools again.');
    return;
  }
  const issue = issues.find(i=>i.id===id);
  if(issue){ issue.status = status; await saveIssues(); render(); }
}

async function toggleVote(id){
  const already = votedIds.includes(id);
  const issue = issues.find(i=>i.id===id);
  if(!issue) return;
  if(already){
    votedIds = votedIds.filter(v=>v!==id);
    issue.votes = Math.max(0, issue.votes - 1);
  }else{
    votedIds.push(id);
    issue.votes += 1;
  }
  await saveVoted();
  await saveIssues();
  render();
}

async function deleteIssue(id){
  if(!(await verifyOwnerToken())){
    isOwner = false; ownerToken = null; updateOwnerToggle(); render();
    showFlash('err', 'Owner session not valid — unlock owner tools again.');
    return;
  }
  issues = issues.filter(i=>i.id!==id);
  await saveIssues();
  render();
}

document.getElementById('submitBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('fTitle').value.trim();
  const description = document.getElementById('fDesc').value.trim();
  const category = document.getElementById('fCategory').value;
  const mod = document.getElementById('rMod').value;
  const btn = document.getElementById('submitBtn');

  if(!title || !description){
    showFlash('err', 'Add both a title and a description before submitting.');
    return;
  }
  if(!mod){
    showFlash('err', 'Give the mod list a moment to load, then try again.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Screening report...';

  const result = await moderate(title, description);

  btn.disabled = false;
  btn.textContent = 'Submit report';

  if(!result.allowed){
    showFlash('err', `This report wasn't posted: ${result.reason || "it didn't look like a genuine bug or feature report."}`);
    return;
  }

  issues.push({
    id: uid(),
    title, description, category, mod,
    severity: selectedSeverity,
    status: 'open',
    createdAt: new Date().toISOString(),
    votes: 0
  });
  await saveIssues();

  document.getElementById('fTitle').value = '';
  document.getElementById('fDesc').value = '';
  showFlash('ok', 'Report posted. Thanks for helping track down the bug.');
  render();
});

['fSearch','fMod','fCat','fStatus','fSort'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

loadOwnerState();
loadMods();
loadIssues();
</script>
</body>
</html>
